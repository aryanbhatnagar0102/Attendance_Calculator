<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Calculator</title>
    <link rel = "stylesheet" href = "style.css">
</head>
<body>

    <div class="calculator">

        <div class="header">

            <h1>Attendance Calculator</h1>

            <p>
                Know your Attendance.
                Know your Bunks.
            </p>
        </div>

    <div class="form">

    <label for = "attended">Lectures Attended</label>
    <input type = "number"
     id= "attended"
     placeholder="e.g. 60"
     min="0">

    <label for = "total">Total Lectures</label>
    <input type = "number"
     id= "total"
     placeholder="e.g. 80"
     min="1">

    <label for = "required">Required Attendance</label>
    <input type = "number"
     id= "required"
     placeholder="e.g. 75"
     min="0"
     max="100">

    <button id = "calculate">Calculate Attendance</button>
    </div>
    <div id = "result"></div>

    <div class="footer">
        Built for students who wants to BUNK.
    </div>

    </div>

<script src = "script.js"></script>
</body>
</html>
