<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <h1>Attendance Calculator</h1>

        <p class="description">
            Check your attendance and find out how many lectures you can bunk.
        </p>

        <div class="form-group">
            <label for="attended">Lectures Attended</label>
            <input type="number" id="attended" placeholder="e.g. 45">
        </div>

        <div class="form-group">
            <label for="total">Total Lectures</label>
            <input type="number" id="total" placeholder="e.g. 60">
        </div>

        <div class="form-group">
            <label for="left">Lectures Left</label>
            <input type="number" id="left" placeholder="e.g. 20">
        </div>

        <div class="form-group">
            <label for="required">Required Attendance (%)</label>
            <input type="number" id="required" placeholder="e.g. 75">
        </div>

        <button id="calculate">Calculate Attendance</button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
