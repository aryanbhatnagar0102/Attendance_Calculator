<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Calculator</title>
</head>
<body>

    <h1>Attendance Calculator</h1>
    
    <p>Calculate Your Attendance</p>

    <label for = "attended">Lectures Attended</label>
    <input type = "number" id= "attended">

    <label for = "total">Total Lectures</label>

    <label for = "required">Required Attendance</label>
    <input type = "number" id="required">

    <button id = "calculate">Calculate Attendance</button>

    <div id = "result"></div>

<script src = "script.js"></script>
</body>
</html>
